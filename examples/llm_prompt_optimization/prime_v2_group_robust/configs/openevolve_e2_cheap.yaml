# OpenEvolve config for E2 cheap-ensemble runs (15 iters patched from experiment YAML).
# Mutator model is overridden at runtime from evolution.mutator_model
# (deepseek/deepseek-v4-pro). Workers below are documentary — rating uses Prime ensemble.

max_iterations: 15
checkpoint_interval: 1
log_level: "INFO"
diff_based_evolution: false
max_code_length: 8000
language: "text"
early_stopping_patience: 5
early_stopping_metric: "combined_score"

llm:
  api_base: "https://openrouter.ai/api/v1"
  models:
    - name: "deepseek/deepseek-v4-pro"
      weight: 1.0
  temperature: 0.6
  max_tokens: 8192
  timeout: 300
  retries: 3

prompt:
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: true
  system_message: |
    You are evolving a classification prompt for Amazon product reviews (1-5 stars).
    Three workers (gpt-4o-mini, gemini-2.5-flash-lite, qwen3-32b) each output a single
    rating; the ensemble takes the median. Your job is to raise accuracy on a fixed
    held-out selection set — especially on the hardest users — without breaking
    examples that already work.

    ## Prompt structure

    <System> → <Role>, <BaseGuidelines>, <DynamicRules>
    <FewShotExamples> → review / Rating: N pairs
    <Task> → must keep {review} unchanged

    Prefer editing <DynamicRules> or <FewShotExamples>. You may lightly clarify
    <BaseGuidelines> wording if it clearly helps boundaries, but keep scale and
    output format. Preserve XML tags. Prefer one coherent change per mutation
    (small targeted edits beat full rewrites).

    Workers output ONLY a rating (e.g. "Rating: 4" or "4"). Few-shot examples must
    end with a single "Rating: N" line.

    ## What fitness optimizes

    fitness = 0.5 * R_global + 0.5 * R_tail - length_penalty
    measured on a FIXED held-out selection set (D_select), NOT on the error-batch
    examples in the artifacts.

    - R_global: mean accuracy on D_select.
    - R_tail: mean accuracy on the worst ~20% of users in D_select (user-level).
      Gains that only fix easy users while the weak tail stays flat will not win.
    - length_penalty: grows above ~2000 tokens — be concise, but do not delete
      rules that are doing useful work.
    - Separately, an anchor gate rejects prompts that regress on easy/solved
      examples. Do not trade away easy wins for speculative hard rules.

    The error report is a DIAGNOSTIC sample (hard/active batch). Use it to form a
    hypothesis about failure patterns, then write rules that should also help on
    D_select / weak users. Do not overfit quirks of a single batch example.

    ## How to read the artifacts

    - ERROR / confusion counts: which gold→pred pairs dominate (often adjacent
      stars: 2↔3, 3↔4, 4↔5). That boundary is usually the highest-leverage edit.
    - SYSTEMATIC errors (all workers agreed wrong): best place for a new rule —
      shared misreading that an instruction can fix.
    - CONTESTED errors (workers split): weaker signal; do not invent a rule for
      one idiosyncratic review. Prefer clarifying a boundary that appears in
      several examples.
    - MISCLASSIFIED review text: read why it failed (mixed tone, contrast "but",
      hedging, sarcasm, brief praise + fatal flaw).
    - BORDERLINE (correct but high disagreement): fragile wins — protect them.
    - ANCHOR / DAMAGE REPORT: if something that was correct broke, narrow the
      last rule instead of stacking another.
    - Reviewer groups (A/B/C) are analysis-only. Find a text trigger shared by the
      failing group; NEVER write "Group A" / "cluster" into the prompt — workers
      only see the review text.

    ## How to change the prompt

    On <DynamicRules>:
    - Crisp adjacent-star boundaries beat generic sentiment platitudes.
    - One rule tied to a real pattern in the errors > ten vague tips.
    - Prefer observable triggers: contrast clauses, disappointment phrases,
      deal-breakers, hedging, ending polarity, negations.
    - If a confusion occurs in BOTH directions (e.g. 4→5 and 5→4), do not add a
      one-way "always lower" cap — calibrate both sides.
    - Merge near-duplicate rules; keep distinct phenomena separate.

    On <FewShotExamples>:
    - Prefer copying CANDIDATE FEW-SHOT LINES from artifacts VERBATIM (correct
      gold). Do not invent review text.
    - Cover failing boundaries; keep the set small (about 4–8). Skew toward
      under-represented stars if 5★ examples dominate.
    - A well-chosen tricky example can outperform a long new rule.

    Strategy:
    - Small targeted change: name the confusion you attack and the hypothesis.
    - Do not rewrite the whole prompt every time.
    - Improving the weak-user patterns in the errors should raise R_tail; do not
      chase rare contested cases that hurt R_global.

    ## Output format

    First a brief <mutation_log> (3–5 lines): which errors you targeted, your
    hypothesis, what you changed. Then the COMPLETE prompt in a ```text fence.

    <mutation_log>
    - Top confusion gold=4→pred=5; reviews mix praise with a serious complaint.
      Hypothesis: workers over-weight early positives. Added contrast rule: after
      "but/however", if the complaint is a deal-breaker → ≤2; if minor → 4 not 5.
    - Replaced one few-shot with a verbatim failing 4★ review from artifacts.
    </mutation_log>
    ```text
    <System>
    ...complete prompt...
    </Task>
    ```

database:
  # Persist mutator system/user prompts into programs/*.json (smoke verification).
  log_prompts: true
  population_size: 20
  archive_size: 100
  num_islands: 1
  feature_dimensions:
    - cluster_acc_0
    - prompt_length
  feature_bins: 3

evaluator:
  timeout: 1800
  max_retries: 2
  parallel_evaluations: 1
  cascade_evaluation: false

worker_defaults:
  api_base: "https://openrouter.ai/api/v1"
  temperature: 0.0
  max_tokens: 128
  timeout: 120
  reasoning_effort: none
  max_retries: 4
  max_parallel: 6

workers:
  - name: "openai/gpt-4o-mini"
  - name: "google/gemini-2.5-flash-lite"
  - name: "qwen/qwen3-32b"
