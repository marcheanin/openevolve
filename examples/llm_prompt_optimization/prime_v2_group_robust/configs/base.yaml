# Base PRIME v2 configuration — merge with experiment-specific overrides

prompt_path: prompts/initial_prompt.txt

dataset:
  name: amazon
  data_root: ./data
  category_id: null
  min_user_reviews: 1
  max_train_users: 200
  max_val_users: 50
  max_test_users: 50
  max_reviews_per_user: 10
  al_candidate_pool_size: 2000
  cache_dir: null
  use_cache: true

clusters:
  n_clusters: 8
  embedding_model: all-MiniLM-L6-v2
  seed: 42
  pca_components: 32
  allow_synthetic_fallback: false

ensemble:
  api_base: https://openrouter.ai/api/v1
  max_parallel: 8
  timeout: 75
  max_retries: 4
  tie_break: lowest_rating
  workers:
    - name: openai/gpt-4o-mini
      temperature: 0.0
      max_tokens: 64
    - name: google/gemini-2.5-flash
      temperature: 0.0
      max_tokens: 64
    - name: anthropic/claude-3-5-haiku
      temperature: 0.0
      max_tokens: 64

fitness:
  mode: cvar
  w_cvar: 0.5
  w_global: 0.3
  w_kappa: 0.2
  cvar_quantile: 0.33
  prompt_len_limit: 8000
  len_penalty_per_100: 0.01
  len_penalty_start: 2000

acquisition:
  policy: group_aware
  batch_size: 80
  hard_ratio: 0.7
  oversample_factor: 3.0
  n_diversity_clusters: 8
  expansion_trigger: 25
  expansion_batch: 40
  expansion_policy: disagreement
  group_quota_enabled: true

evolution:
  n_evolve_iterations: 15
  population_size: 30
  archive_size: 500
  mutator_model: google/gemini-2.5-pro
  mutator_temperature: 0.6
  mutator_max_tokens: 8192
  structured_prompt: true
  synthetic_fewshot: false

consolidation:
  enabled: true
  top_k_archive: 3
  pool_carryover_k: 3
  cluster_pareto: false
  gate_delta: 0.01
  every_n_cycles: 1
  scope: base_guidelines

active_learning:
  n_cycles: 6
  seed: 42
  selection_mode: lexicographic
  selection_w_cvar: 0.7
  selection_w_global: 0.3
  proxy_validation_min_cycles: 2

experiment:
  name: run
  results_dir: results
  smoke: false
  smoke_n_cycles: 1
  smoke_n_evolve: 2
  smoke_max_examples: 200
