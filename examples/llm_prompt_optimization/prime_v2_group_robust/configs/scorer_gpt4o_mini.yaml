# E6 single scorer — Amazon category-shift controls (parity with E5 single-scorer design).

ensemble:
  mode: single
  fail_closed: true
  api_base: https://openrouter.ai/api/v1
  max_parallel: 16
  timeout: 90
  max_retries: 5
  aggregation: median
  tie_break: lowest_rating
  workers:
    - name: openai/gpt-4o-mini
      temperature: 0.0
      max_tokens: 32
      reasoning_effort: none
