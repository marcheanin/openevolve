# E1 arm 2 (smoke-scale): global accuracy fitness — same budget/seed as arm 1.

includes:
  - ../../configs/base_v3.yaml

experiment:
  name: E1_global_fitness
  smoke: true
  smoke_n_cycles: 1
  smoke_max_examples: 150

fitness:
  mode: global

data_roles:
  d_select_size: 40
  d_anchor_size: 12
  n_min_per_group: 10

dataset:
  max_train_users: 40
  max_val_users: 20
  max_test_users: 20
  max_reviews_per_user: 8
  al_candidate_pool_size: 300

acquisition:
  batch_size: 30

active_learning:
  seed: 42
