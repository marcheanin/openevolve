includes:
  - ../../configs/base.yaml

# E1 live pilot: real WILDS OOD splits + OpenRouter ensemble + 3 AL cycles.
# Requires: OPENROUTER_API_KEY in env (or .env in package root).

experiment:
  name: E1_cvar_live_wilds
  smoke: false
  force_mock: false
  verbose: true
  smoke_validate: true

openevolve_config_path: configs/openevolve_e1_live.yaml

fitness:
  mode: cvar
  w_cvar: 0.7
  w_global: 0.2
  w_kappa: 0.1

dataset:
  data_root: ./data
  max_train_users: 30
  max_val_users: 15
  max_test_users: 15
  max_reviews_per_user: 8
  al_candidate_pool_size: 240
  use_cache: true

clusters:
  n_clusters: 6

acquisition:
  policy: lexicographic
  batch_size: 36
  expansion_trigger: 12
  expansion_batch: 12

evolution:
  n_evolve_iterations: 3
  population_size: 8

consolidation:
  pool_carryover_k: 2

active_learning:
  n_cycles: 3
  seed: 42
  selection_w_cvar: 0.7
  selection_w_global: 0.3

ensemble:
  max_parallel: 6
