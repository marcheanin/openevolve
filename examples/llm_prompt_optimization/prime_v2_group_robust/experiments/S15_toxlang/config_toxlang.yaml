# S15, многоязычная токсичность. Скорер тот же, что на стендах civil и mnli
# (google/gemma-3-12b-it, temperature 0, max_tokens 16, fail-closed); отличается ТОЛЬКО
# политика повторов при транспортных отказах.
#
# Зачем. При первом прогоне DeepInfra отдавал 429 настолько часто, что 12,5 % строк исчерпывали
# все попытки и записывались как «неразобранные». Такая строка выбрасывается из анализа сразу для
# ВСЕХ промптов пула (условие парности бутстрепа), то есть теряется восьмая часть теста — и
# теряется по причине, не имеющей отношения ни к промпту, ни к языку: доля потерь оказалась
# равномерной по шести языкам (6/39, 3/45, 7/43, 6/42, 5/35, 3/36).
#
# Что меняется и почему это не влияет на сопоставимость со стендами civil и mnli. Повтор —
# транспортный: при температуре 0 успешный вызов возвращает то же самое, сколько бы попыток ему
# ни предшествовало. Политика повторов не меняет ни модель, ни промпт, ни разбор ответа; она
# меняет только долю строк, по которым ответ вообще получен. Поэтому увеличение числа попыток
# строго улучшает качество данных и не создаёт различия с прежними стендами в том, что измеряется.
#
# Разбор ответа повторов НЕ делает: неразобранный ответ уходит в INVALID сразу (fail_closed).
# Значит повторы не могут «дорабатывать» трудные строки и не являются конфаундом по группам.

includes:
  - ../../configs/base_v3.yaml
  - ../../configs/dataset_civilcomments_e5.yaml
  - ../../configs/scorer_gemma3.yaml

prompt_path: prompts/initial_prompt_civilcomments.txt

ensemble:
  max_retries: 12   # было 5; при 429 задержка растёт как min(30, 4*попытка) секунд
  timeout: 90       # было 60
