# Live micro-smoke for the Pareto-front loop: real OpenRouter, tiny data, 2 cycles
# x 1 OE iteration. Only purpose is to exercise the paths a mock run cannot reach —
# OE checkpoint parsing, the seeded resume in cycle 2, consolidation scored on
# D_select, and marker stripping on real mutator output. Not a result.

includes:
  - ../../configs/base_v3.yaml

experiment:
  name: E1_pareto_live_smoke
  results_dir: results
  smoke: true
  smoke_n_cycles: 2
  smoke_max_examples: 10000
  force_mock: false
  verbose: true
  smoke_validate: true

openevolve_config_path: configs/openevolve_e1_live.yaml

fitness:
  mode: cvar_lex
  cvar_quantile: 0.33
  epsilon_global: 0.01

data_roles:
  enabled: true
  stratify: true
  d_select_size: 24
  d_anchor_size: 12
  d_audit_size: 6
  n_min_per_group: 4
  anchor_gate_delta: 0.02
  anchor_gate_alpha: 0.05

dataset:
  data_root: ./data
  max_train_users: 12
  max_val_users: 6
  max_test_users: 6
  max_reviews_per_user: 4
  al_candidate_pool_size: 40
  use_cache: true

clusters:
  geometry: pred_profile
  n_clusters: 3
  min_users_per_cluster: 2
  seed: 42
  control: none
  descriptors_enabled: true
  allow_synthetic_fallback: false

acquisition:
  policy: group_aware
  batch_size: 8
  expansion_trigger: 4
  expansion_batch: 4

evolution:
  n_evolve_iterations: 1
  population_size: 4
  mutator_model: z-ai/glm-5
  mutator_temperature: 0.6
  mutator_max_tokens: 8192

consolidation:
  pool_carryover_k: 2

pareto:
  enabled: true
  champion_margin: 0.01
  score_consolidated_on_select: true
  seed_openevolve_from_front: true
  gate_fallback_down_front: true

active_learning:
  n_cycles: 2
  seed: 42
  selection_mode: lexicographic
  proxy_tail_metric: R_tail
  tail_quantile: 0.2

ensemble:
  max_parallel: 8
  timeout: 120

budget:
  total_calls: 4000
  on_exhausted: warn
