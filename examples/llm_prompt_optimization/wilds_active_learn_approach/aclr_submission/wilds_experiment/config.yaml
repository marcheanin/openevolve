max_iterations: 500
checkpoint_interval: 10
log_level: INFO
diff_based_evolution: false
max_code_length: 7500
language: text
early_stopping_patience: 5
early_stopping_metric: combined_score
convergence_threshold: 0.001
llm:
  api_base: https://openrouter.ai/api/v1
  models:
  - name: google/gemini-2.5-pro
    weight: 1.0
  temperature: 0.6
  max_tokens: 8192
  timeout: 300
  retries: 5
prompt:
  template_dir: null
  num_top_programs: 5
  num_diverse_programs: 3
  include_artifacts: true
  system_message: "You are evolving a classification prompt for Amazon product reviews\
    \ across\nall categories (1-5 stars). Three LLM workers (GPT-4o-mini, Gemini 2.5\
    \ Flash,\nClaude 3.5 Haiku) receive your prompt, each outputs a single rating,\
    \ majority vote wins.\n\n## What you're working with\n\nThe prompt has XML structure:\n\
    \  <System> → <Role>, <BaseGuidelines>, <DynamicRules>\n  <FewShotExamples> →\
    \ review/rating pairs\n  <Task> → the {review} placeholder\n\nKeep <Task> unchanged.\
    \ Everything else is yours to reshape: rewrite\nrules, reorganize sections, add\
    \ or remove examples, change wording,\nrestructure <DynamicRules> however you\
    \ see fit. You may also refine\n<BaseGuidelines> if you find a wording that helps\
    \ workers classify\nmore accurately — but keep the core intent (scale, output\
    \ format).\n\nWorkers output ONLY a rating (e.g. \"Rating: 4\" or \"4\"). Few-shot\
    \ examples\nmust end with a single \"Rating: N\" line.\n\n## What matters for\
    \ fitness\n\nfitness = 0.5 * Acc_Hard + 0.3 * Acc_Anchor + 0.2 * kappa_Hard -\
    \ length_penalty\n\n- **Acc_Hard** (50% weight): accuracy on the difficult examples\
    \ — reviews\n  the ensemble previously got wrong or disagreed on. This is where\
    \ almost\n  all improvement potential lives.\n- **Acc_Anchor** (30%): accuracy\
    \ on easy, stable examples. Regressions here\n  are very costly — avoid breaking\
    \ what already works.\n- **kappa_Hard** (20%): inter-worker agreement on hard\
    \ examples. When workers\n  agree, the majority vote is more reliable.\n- **length_penalty**:\
    \ grows above ~2000 tokens. Concise prompts that achieve\n  the same accuracy\
    \ always score higher.\n\n## Evaluation artifacts — your main signal\n\nEach evaluation\
    \ gives you concrete data. Pay close attention to:\n\n- **ERROR DISTRIBUTION**:\
    \ which gold→predicted pairs happen most. This tells\n  you where the prompt is\
    \ systematically wrong — e.g. if gold=3→pred=4 is\n  the top error, the 3-vs-4\
    \ boundary needs work.\n- **MISCLASSIFIED EXAMPLES**: actual review text with\
    \ gold rating, predicted\n  rating, and per-worker votes. Read these carefully\
    \ — they reveal *why* the\n  prompt fails (tone misread, sarcasm, mixed signals,\
    \ brevity).\n- **BORDERLINE EXAMPLES**: correctly classified but workers disagreed.\
    \ These\n  are fragile — a small prompt change could flip them.\n- **RULE COVERAGE**:\
    \ flags which star levels lack rules in <DynamicRules>.\n  All 5 levels should\
    \ be represented.\n- **FEW-SHOT BALANCE**: counts examples per rating. Skewed\
    \ distribution can\n  bias workers toward over-represented ratings.\n\nThink of\
    \ the artifacts as a diagnostic report. Your job is to read it,\nform a hypothesis\
    \ about what the prompt gets wrong and why, then make\na targeted change.\n\n\
    ## How to think about changes\n\nYou have full creative freedom over the prompt\
    \ content. Here are\nconsiderations, not rigid rules:\n\n**On DynamicRules:**\n\
    - The distinction between adjacent ratings (especially 2↔3, 3↔4, 4↔5)\n  is where\
    \ most errors happen. Crisp boundary descriptions help all three\n  workers converge.\
    \ Think about what *specific signal* separates \"3 vs 4\"\n  in the reviews that\
    \ were misclassified.\n- A rule that addresses a real pattern in the error data\
    \ is worth more than\n  ten generic platitudes. One good boundary clarification\
    \ can fix several\n  misclassifications at once.\n- If you see two rules that\
    \ say roughly the same thing, combining them\n  makes the prompt tighter without\
    \ losing information. But if two rules\n  address genuinely different phenomena\
    \ (e.g. \"sarcasm\" vs \"brief negative\"),\n  keep them separate — collapsing\
    \ distinct ideas hurts accuracy.\n- Rules can be structured any way you find effective:\
    \ numbered lists,\n  star-level sections, decision-tree style, comparison tables,\
    \ whatever\n  communicates boundaries most clearly to the worker models.\n- Consider\
    \ what each of the three worker models might struggle with.\n  Smaller models\
    \ benefit from explicit, concrete cues; larger models\n  can handle nuance.\n\n\
    **On FewShotExamples:**\n- Examples teach by showing, not telling. A well-chosen\
    \ example of a\n  tricky 3-star review can be more effective than a paragraph\
    \ of rules.\n- When artifacts show a specific error type, turning that exact\n\
    \  misclassified review into a few-shot example (with the correct rating)\n  directly\
    \ teaches the pattern.\n- Coverage across all 5 ratings matters — if you have\
    \ no 2-star example,\n  workers may avoid predicting 2.\n- Quality over quantity.\
    \ 7-12 diverse, well-chosen examples beat 15\n  mediocre ones while keeping the\
    \ prompt shorter.\n- If a **Suggested synthetic FewShot (draft)** section appears\
    \ in your context, treat it\n  as optional: merge with current <FewShotExamples>,\
    \ replace them, take a subset, or\n  ignore — pick what improves fitness (Hard/Anchor/kappa).\n\
    \n**On prompt length:**\n- There's a real cost to being long: length_penalty in\
    \ fitness, plus\n  longer prompts can confuse smaller workers. But there's also\
    \ a cost to\n  being too terse — if you remove a useful rule, accuracy drops.\n\
    - Let accuracy drive your decisions. Don't add words for the sake of it,\n  but\
    \ don't aggressively cut rules that are doing useful work either.\n\n**General\
    \ strategy advice:**\n- Small, targeted changes often outperform rewrites. If\
    \ the current prompt\n  scores 0.68, changing one confused boundary can push it\
    \ to 0.72. Changing\n  everything at once risks regressing on Anchor examples.\n\
    - Read the misclassified examples. Really read them. The answer to\n  \"what should\
    \ I change?\" is almost always in the error data.\n- If workers disagree on a\
    \ correctly-classified example (borderline),\n  that's a fragile win — consider\
    \ adding a rule that makes it robust.\n- Anchor accuracy is your floor. If you\
    \ break Anchor examples, you lose\n  0.3 weight regardless of Hard improvements.\n\
    \n## Output format\n\nFirst, a brief <mutation_log> (3-5 lines): what you changed\
    \ and your\nreasoning (which errors you targeted, what hypothesis you tested).\n\
    Then the complete prompt in a ```text code fence.\n\n<mutation_log>\n- Observed\
    \ gold=3→pred=4 as top error; reviews have mixed tone but workers\n  over-index\
    \ on positive phrases. Added boundary rule: mixed tone with\n  notable complaints\
    \ → 3 even if some positive language present.\n- Replaced few-shot #6 with a misclassified\
    \ 3-star review from artifacts.\n- Tightened wording on two near-duplicate 5-star\
    \ rules.\n</mutation_log>\n```text\n<System>\n...complete prompt...\n</Task>\n\
    ```\n"
database:
  population_size: 30
  archive_size: 500
  num_islands: 1
  feature_dimensions:
  - prompt_length
  - Acc_Hard
  feature_bins: 5
  elite_selection_ratio: 0.4
  exploration_ratio: 0.3
  exploitation_ratio: 0.3
evaluator:
  model: deepseek-chat-v3
  timeout: 1800
  max_retries: 3
  parallel_evaluations: 1
  cascade_evaluation: false
generalization:
  gap_threshold: 0.1
  gap_penalty: 0.5
evolution_trace:
  enabled: true
  format: jsonl
  include_code: true
  include_prompts: true
  output_path: ''
  buffer_size: 1
  compress: false
worker_defaults:
  api_base: https://openrouter.ai/api/v1
  temperature: 0.0
  max_tokens: 64
  timeout: 75
  max_retries: 4
  max_parallel: 8
workers:
- name: openai/gpt-4o-mini
- name: google/gemini-2.5-flash
- name: anthropic/claude-3.5-haiku
active_learning:
  uncertainty_threshold: 0.0
  batch_size: 80
  hard_ratio: 0.7
  synthetic_fewshot:
    enabled: true
    mode: inject_as_hint
    mutator_lock_fewshot: false
    n_examples: 8
    n_boundary_pairs: 4
    model: null
    temperature: 0.7
    max_tokens: 4096
    max_retries: 2
  min_hard_batch_ratio: 0.55
  expansion_trigger: 15
  soft_expansion_patience: 3
  soft_expansion_min_delta: 0.02
  soft_expansion_skip_near_best: 0.005
  seen_reeval_interval: 3
  refresh_per_cycle: 10
  generalization_gap_warn_threshold: 0.03
  generalization_gap_stop_threshold: 0.08
  generalization_gap_stop_patience: 2
  consolidation_gate_delta: 0.01
  consolidation_gate_vs_best_delta: 0.04
  al_early_stopping_patience: 2
  al_early_stopping_min_cycles: 6
dataset:
  config_path: dataset_all_categories.yaml
  max_samples: null
  max_train_users: 25
  max_val_users: 15
  max_reviews_per_user: 15
  stratify_users: true
prompt_path: initial_prompt_all_categories.txt
output_dir: results_all_categories_prime_submission
